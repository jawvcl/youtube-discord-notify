name: diag
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          for u in 'playlist?list=UUJMW5nKtT9uSHWINC-aAUPw' 'channel/UCJMW5nKtT9uSHWINC-aAUPw/videos' 'playlist?list=UUEnjAAmVQ9wx8CDPDV6Y4sg' 'channel/UCEnjAAmVQ9wx8CDPDV6Y4sg/streams'; do
            code=$(curl -sL -A "$UA" -H 'Accept-Language: ko' -o page.html -w '%{http_code} %{url_effective}' "https://www.youtube.com/$u")
            echo "PAGE $u -> $code size=$(wc -c < page.html) plv=$(grep -o '"playlistVideoRenderer"' page.html | wc -l) ids=$(grep -o '"videoId":"[A-Za-z0-9_-]*"' page.html | sort -u | wc -l) tipp=$(grep -c ei8uw24nJoQ page.html) jyo=$(grep -c ar2DxbPWo_I page.html)"
          done
          c=""; p=""
          for i in $(seq 30); do
            c="$c$(curl -s -o /dev/null -w '%{http_code}' 'https://www.youtube.com/feeds/videos.xml?channel_id=UCJMW5nKtT9uSHWINC-aAUPw' | cut -c1)"
            p="$p$(curl -s -o /dev/null -w '%{http_code}' 'https://www.youtube.com/feeds/videos.xml?playlist_id=UUJMW5nKtT9uSHWINC-aAUPw' | cut -c1)"
            sleep 8
          done
          echo "FEED channel  $c"
          echo "FEED playlist $p"
