name: diag
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - run: |
          for q in channel_id=UCJMW5nKtT9uSHWINC-aAUPw playlist_id=UUJMW5nKtT9uSHWINC-aAUPw channel_id=UCEnjAAmVQ9wx8CDPDV6Y4sg playlist_id=UUEnjAAmVQ9wx8CDPDV6Y4sg; do
            printf '%s: ' "$q"
            for i in 1 2 3 4 5 6; do curl -s -o /dev/null -w '%{http_code} ' "https://www.youtube.com/feeds/videos.xml?$q"; sleep 4; done
            echo
          done
